name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Manage release PR and tags
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release credentials
        run: |
          if [ -z "${{ secrets.RELEASE_PLEASE_TOKEN }}" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN is not configured. Falling back to GITHUB_TOKEN; note that tags created by GITHUB_TOKEN will not trigger downstream release workflows."
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
